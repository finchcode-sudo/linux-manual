name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install required SDK platform & build-tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -n1)
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.0.12077973"

      - name: Download Termux bootstrap
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o app/src/main/assets/bootstrap-aarch64.zip \
            "https://github.com/termux/termux-packages/releases/download/bootstrap-2022.04.28-r5+apt-android-7/bootstrap-aarch64.zip"
          echo "4a51a7eb209fe82efc24d52e3cccc13165f27377290687cb82038cbd8e948430  app/src/main/assets/bootstrap-aarch64.zip" | sha256sum -c -

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
